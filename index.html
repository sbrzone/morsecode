<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse Code Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="floating-circle circle-1"></div>
        <div class="floating-circle circle-2"></div>
        <div class="floating-circle circle-3"></div>
        <div class="floating-circle circle-4"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>MORSE CODE PRO</h1>
            <div class="converter-toggle">
                <button class="toggle-btn active" onclick="switchConverter('text-to-morse')">
                    🔤 Text → Morse
                </button>
                <button class="toggle-btn" onclick="switchConverter('morse-to-text')">
                    📡 Morse → Text
                </button>
            </div>
        </div>
        
        <div class="content">
            <!-- Text to Morse Section -->
            <div id="text-to-morse" class="converter-section active">
                <div class="input-group">
                    <label for="textInput">ENTER TEXT (ANY LANGUAGE)</label>
                    <textarea 
                        id="textInput" 
                        placeholder="Type your message here in any language... Example: Hello বিশ্ব, नमस्ते, 你好"
                        oninput="convertToMorse()"
                    ></textarea>
                </div>
                
                <div class="button-group">
                    <button class="action-btn clear-btn" onclick="clearText()">
                        🗑️ CLEAR
                    </button>
                    <button class="action-btn copy-btn" onclick="copyMorseCode()">
                        📋 COPY CODE
                    </button>
                </div>
                
                <div class="output-group">
                    <label class="output-label">MORSE CODE OUTPUT</label>
                    <div id="morseOutput" class="morse-output">
                        Your encoded message will appear here...
                    </div>
                </div>
            </div>

            <!-- Morse to Text Section -->
            <div id="morse-to-text" class="converter-section">
                <div class="input-group">
                    <label for="morseInput">ENTER MORSE CODE</label>
                    <textarea 
                        id="morseInput" 
                        placeholder="Enter morse code here... Example: .... . .-.. .-.. --- / .-- --- .-. .-.. -.."
                        oninput="convertToText()"
                    ></textarea>
                </div>
                
                <div class="button-group">
                    <button class="action-btn clear-btn" onclick="clearMorse()">
                        🗑️ CLEAR
                    </button>
                    <button class="action-btn copy-btn" onclick="copyText()">
                        📋 COPY TEXT
                    </button>
                </div>
                
                <div class="output-group">
                    <label class="output-label">TEXT OUTPUT</label>
                    <div id="textOutput" class="text-output">
                        Your decoded text will appear here...
                    </div>
                </div>
            </div>

            <div class="credit">
                CREATED BY SOBUJ RAHMAN
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
